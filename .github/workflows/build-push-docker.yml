name: Build and Push Docker to ACR

on:
  push:
    branches:
      - main
      - prod
      - production
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: |
          az acr login --name vxtacr

      - name: Build Docker image
        run: |
          docker build -t vxtacr.azurecr.io/vxt-web-app:v1.0 \
                       -t vxtacr.azurecr.io/vxt-web-app:latest .

      - name: Push Docker image to ACR
        run: |
          docker push vxtacr.azurecr.io/vxt-web-app:v1.0
          docker push vxtacr.azurecr.io/vxt-web-app:latest

      - name: Push summary
        run: |
          echo "✅ Docker image pushed successfully!"
          echo "Registry: vxtacr.azurecr.io"
          echo "Image: vxt-web-app"
          echo "Tags: v1.0, latest"
