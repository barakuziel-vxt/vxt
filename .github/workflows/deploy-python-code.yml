name: Deploy Python Code to Azure Web App

on:
  push:
    branches:
      - prod
    paths:
      - 'api_*.py'
      - 'app.py'
      - 'main.py'
      - 'requirements.txt'
      - 'startup.sh'
      - 'startup.py'
      - 'gunicorn_config.py'
      - 'static/**'
      - 'templates/**'
      - '.github/workflows/deploy-python-code.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip uninstall -y pymssql pyodbc 2>/dev/null || true
          pip install -r requirements.txt
      
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Create slim deployment package
        run: |
          mkdir -p _deploy
          cp main.py requirements.txt startup.sh Procfile _deploy/
          # web.config is generated by Oryx - no need to include
          echo "Deployment package contents:"
          ls -lh _deploy/

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: vxt-web-app
          package: _deploy/
      
      - name: Verify App Settings
        run: |
          az webapp config appsettings list \
            --name vxt-web-app \
            --resource-group VXT-IoT-Hub \
            --query "[?name=='SQL_CONNECTION_STRING']" \
            -o table
          
          # Set any missing app settings
          az webapp config appsettings set \
            --name vxt-web-app \
            --resource-group VXT-IoT-Hub \
            --settings \
            ENVIRONMENT="production" \
            PYTHONIOENCODING="utf-8"
      
      - name: Deployment Summary
        run: |
          echo "✅ Python Code Deployment Complete!"
          echo "Web App: https://vxt-web-app-g5gbaee2f4bmgphb.northeurope-01.azurewebsites.net"
          echo "Health Check: https://vxt-web-app-g5gbaee2f4bmgphb.northeurope-01.azurewebsites.net/health/db"
