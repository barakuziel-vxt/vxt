name: Deploy Azure Function

on:
  push:
    branches:
      - prod
    paths:
      - 'azure-functions/function_app.py'
      - 'azure-functions/requirements.txt'
      - '.github/workflows/deploy-function-app.yml'
  workflow_dispatch:

env:
  FUNCTION_APP_NAME: vxt-function
  RESOURCE_GROUP: VXT-IoT-Hub
  PYTHON_VERSION: '3.11'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r azure-functions/requirements.txt
    
    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Create Function App if not exists
      run: |
        # Using existing vxt-function app - no need to create
        echo "Using existing Function App: vxt-function"
        echo "Using existing Storage Account: vxtstorage"
    
    - name: Configure App Settings
      run: |
        # Check if secrets are set
        if [ -z "${{ secrets.DB_PASSWORD }}" ]; then
          echo "⚠️  WARNING: DB_PASSWORD secret is not set"
        fi
        if [ -z "${{ secrets.IOT_HUB_CONNECTION_STRING }}" ]; then
          echo "⚠️  WARNING: IOT_HUB_CONNECTION_STRING secret is not set"
        fi
        
        # Set app settings
        az functionapp config appsettings set \
          --name vxt-function \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --settings \
            PROVIDER_NAME="N2KToSignalK" \
            DB_SERVER="vxtdb.database.windows.net" \
            DB_NAME="vxtdb" \
            DB_USER="vxtadmin" \
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            IoTHubConnectionString="${{ secrets.IOT_HUB_CONNECTION_STRING }}" \
            ENABLE_INIT_SCRIPTS="1"
        
        echo "✅ App settings configured"
    
    - name: Deploy to Azure Function
      run: |
        echo "🚀 Preparing deployment..."
        
        # Zip the function code from azure-functions directory
        cd azure-functions
        echo "📦 Creating deployment package..."
        zip -r ../function-code.zip . \
          -x "*.git*" "__pycache__/*" "*.pyc" ".venv/*" ".vscode/*" "*.md" "local.settings.json"
        
        cd ..
        
        # Deploy the zip file
        echo "📁 Deploying function code..."
        az functionapp deployment source config-zip \
          --resource-group VXT-IoT-Hub \
          --name vxt-function \
          --src function-code.zip 2>&1 | tee deploy.log
        
        DEPLOY_STATUS=${PIPESTATUS[0]}
        echo ""
        if [ $DEPLOY_STATUS -eq 0 ]; then
          echo "✅ Deployment package uploaded successfully"
        else
          echo "❌ Deployment failed with exit code: $DEPLOY_STATUS"
          tail -20 deploy.log
          exit 1
        fi

  test:
    needs: deploy
    runs-on: ubuntu-latest
    
    steps:
    - name: Check deployment status
      run: |
        echo "✅ Deploy job completed successfully"
        echo "Checking Azure Function status (this may take 1-2 minutes to start)..."
    
    - name: Login to Azure for status check
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Check Function App status
      run: |
        # Get function app status
        STATUS=$(az functionapp show --name vxt-function --resource-group VXT-IoT-Hub --query state -o tsv 2>/dev/null || echo "ERROR")
        echo "Function App Status: $STATUS"
        
        # Try to list functions (may take a moment to appear)
        echo ""
        echo "Scanning for deployed functions..."
        az functionapp function list --name vxt-function --resource-group VXT-IoT-Hub 2>/dev/null || echo "Functions not yet visible (may need 1 minute)"
    
    - name: Deployment completed - Manual verification required
      run: |
        echo ""
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo "✅ Function App deployment completed"
        echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
        echo ""
        echo "📋 ACTION ITEMS:"
        echo ""
        echo "1. Wait 1-2 minutes for runtime to fully initialize"
        echo ""
        echo "2. Verify in Azure Portal:"
        echo "   - Go to: Function Apps → vxt-function → Overview"
        echo "   - Status should show 'Running'"
        echo ""
        echo "3. Check function logs:"
        echo "   - Go to: Monitoring → Log stream"
        echo "   - Look for startup errors or initialization messages"
        echo ""
        echo "4. Test health endpoint:"
        echo "   curl -v https://vxt-function.azurewebsites.net/api/health"
        echo ""
        echo "5. Verify app settings (Configuration → Application settings):"
        echo "   - PROVIDER_NAME: N2KToSignalK"
        echo "   - DB_SERVER: vxtdb.database.windows.net"
        echo "   - DB_NAME: vxtdb"
        echo "   - DB_USER: vxtadmin"
        echo "   - DB_PASSWORD: (should be set)"
        echo "   - IoTHubConnectionString: (should be set)"
        echo ""
        echo "6. If functions still don't appear (give it 2+ minutes):"
        echo "   - Check Log stream for Python import or syntax errors"
        echo "   - Verify function.json bindings are properly generated"
        echo """
