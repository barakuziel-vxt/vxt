name: Deploy Azure Function

on:
  push:
    branches:
      - prod
    paths:
      - 'azure-functions/**'
      - '.github/workflows/deploy-function-app.yml'
  workflow_dispatch:

env:
  FUNCTION_APP_NAME: vxt-function
  RESOURCE_GROUP: vxt-functions-linux
  RESOURCE_GROUP_STORAGE: vxt-functions-linux
  STORAGE_ACCOUNT_NAME: vxtfunct
  PYTHON_VERSION: '3.11'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r azure-functions/requirements.txt
    
    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Create Function App if not exists
      run: |
        # Using existing vxt-function app - no need to create
        echo "Using existing Function App: vxt-function"
        echo "Using existing Storage Account: vxtstorage"
    
    - name: Configure App Settings
      run: |
        echo "🔑 Fetching credentials from Azure..."
        
        # Get storage account connection string directly from Azure
        STORAGE_CONN=$(az storage account show-connection-string \
          --resource-group ${{ env.RESOURCE_GROUP_STORAGE }} \
          --name ${{ env.STORAGE_ACCOUNT_NAME }} -o tsv)
        echo "✅ Storage connection string retrieved"
        
        # Get IoT Hub Event Hub endpoint and key
        IOT_ENDPOINT=$(az iot hub show \
          --resource-group VXT-IoT-Hub \
          --name VXT-IoT-Hub \
          --query "properties.eventHubEndpoints.events.endpoint" -o tsv)
        
        IOT_KEY=$(az iot hub policy show \
          --resource-group VXT-IoT-Hub \
          --hub-name VXT-IoT-Hub \
          --name iothubowner \
          --query "primaryKey" -o tsv)
        
        IOT_ENTITY_PATH="iothub-ehub-vxt-iot-hu-66946165-82f53700df"
        IOT_CONN="Endpoint=${IOT_ENDPOINT};SharedAccessKeyName=iothubowner;SharedAccessKey=${IOT_KEY};EntityPath=${IOT_ENTITY_PATH}"
        echo "✅ IoT Hub connection string constructed"
        
        # Set all critical app settings
        az functionapp config appsettings set \
          --name ${{ env.FUNCTION_APP_NAME }} \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --settings \
            FUNCTIONS_WORKER_RUNTIME="python" \
            FUNCTIONS_EXTENSION_VERSION="~4" \
            PYTHON_VERSION="3.11" \
            PROVIDER_NAME="N2KToSignalK" \
            DATABASE_SERVER="vxtdb.database.windows.net" \
            DATABASE_NAME="free-sql-db-5949639" \
            DB_SERVER="vxtdb.database.windows.net" \
            DB_NAME="free-sql-db-5949639" \
            DATABASE_USER="vxt-function" \
            EVENT_HUB_NAME="events" \
            AzureWebJobsStorage="${STORAGE_CONN}" \
            IoTHubConnectionString="${IOT_CONN}" \
            ENABLE_INIT_SCRIPTS="1"
        
        echo "✅ All app settings configured"
        echo "⚡ App will restart automatically to apply settings"
    
    - name: Deploy to Azure Function
      run: |
        echo "🚀 Preparing deployment..."
        
        # Bundle Python packages inside the zip so they are available when the function
        # runs from package (WEBSITE_RUN_FROM_PACKAGE). Azure Functions looks for packages
        # in .python_packages/lib/site-packages/ relative to the function root.
        cd azure-functions
        echo "📦 Installing Python packages for bundled deployment..."
        pip install -r requirements.txt \
          --target .python_packages/lib/site-packages \
          --upgrade \
          --no-cache-dir
        echo "✅ Packages installed into .python_packages/"
        
        # Zip the function code from azure-functions directory (includes .python_packages)
        echo "📦 Creating deployment package..."
        zip -r ../function-code.zip . \
          -x "*.git*" "__pycache__/*" "*.pyc" ".venv/*" ".vscode/*" "*.md" "local.settings.json"
        
        cd ..
        
        # Deploy the zip file
        echo "📁 Deploying function code..."
        az functionapp deployment source config-zip \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name ${{ env.FUNCTION_APP_NAME }} \
          --src function-code.zip 2>&1 | tee deploy.log
        
        DEPLOY_STATUS=${PIPESTATUS[0]}
        echo ""
        if [ $DEPLOY_STATUS -eq 0 ]; then
          echo "✅ Deployment package uploaded successfully"
        else
          echo "❌ Deployment failed with exit code: $DEPLOY_STATUS"
          tail -20 deploy.log
          exit 1
        fi

  test:
    needs: deploy
    runs-on: ubuntu-latest
    
    steps:
    - name: Check deployment status
      run: echo "Deploy job completed successfully"
    
    - name: Login to Azure for status check
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Check Function App status
      run: |
        STATUS=$(az functionapp show --name ${{ env.FUNCTION_APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} --query state -o tsv 2>/dev/null || echo "UNKNOWN")
        echo "Function App Status: $STATUS"
        echo ""
        echo "Checking deployed functions..."
        az functionapp function list --name ${{ env.FUNCTION_APP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }} 2>/dev/null || echo "Functions scanning..."
    
    - name: Print next steps
      run: |
        echo ""
        echo "DEPLOYMENT COMPLETE"
        echo "=================="
        echo ""
        echo "Next steps:"
        echo "1. Wait 1-2 minutes for the function app runtime to initialize"
        echo "2. Check Azure Portal: Function Apps > vxt-function > Overview"
        echo "3. Monitor logs: Monitoring > Log stream"
        echo "4. Test health: curl https://vxt-function.azurewebsites.net/api/health"
