name: Deploy Azure Function

on:
  push:
    branches:
      - prod
    paths:
      - 'azure-functions/function_app.py'
      - 'azure-functions/requirements.txt'
      - '.github/workflows/deploy-function-app.yml'
  workflow_dispatch:

env:
  FUNCTION_APP_NAME: vxt-function
  RESOURCE_GROUP: VXT-IoT-Hub
  PYTHON_VERSION: '3.11'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r azure-functions/requirements.txt
    
    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Create Function App if not exists
      run: |
        # Using existing vxt-function app - no need to create
        echo "Using existing Function App: vxt-function"
        echo "Using existing Storage Account: vxtstorage"
    
    - name: Configure App Settings
      run: |
        az functionapp config appsettings set \
          --name vxt-function \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --settings \
            PROVIDER_NAME="N2KToSignalK" \
            DB_SERVER="vxtdb.database.windows.net" \
            DB_NAME="vxtdb" \
            DB_USER="vxtadmin" \
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            IoTHubConnectionString="${{ secrets.IOT_HUB_CONNECTION_STRING }}"
    
    - name: Deploy to Azure Function
      run: |
        cd azure-functions
        az functionapp up \
          --name vxt-function \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --runtime python \
          --runtime-version ${{ env.PYTHON_VERSION }} \
          --functions-version 4 \
          --build remote || echo "Deployment completed with status $?"

  test:
    needs: deploy
    runs-on: ubuntu-latest
    
    steps:
    - name: Deployment completed - Manual verification required
      run: |
        echo "✅ Deployment completed successfully"
        echo ""
        echo "📋 MANUAL VERIFICATION REQUIRED:"
        echo ""
        echo "1. Go to Azure Portal → Function Apps → vxt-function"
        echo "2. Check Overview tab - should show 'Running' status"
        echo "3. If not running:"
        echo "   - Check 'Monitoring' → 'Log stream' for errors"
        echo "   - Check 'Configuration' → 'Application settings' to verify environment variables"
        echo "   - Verify GitHub secrets are set: AZURE_CREDENTIALS, DB_PASSWORD, IOT_HUB_CONNECTION_STRING"
        echo ""
        echo "4. Manual health check (after function starts):"
        echo "   curl https://vxt-function.azurewebsites.net/api/health"
