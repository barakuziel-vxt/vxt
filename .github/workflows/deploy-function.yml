name: Deploy Azure Function

on:
  push:
    branches:
      - prod
    paths:
      - 'azure-functions/function_app.py'
      - 'azure-functions/requirements.txt'
      - 'azure-functions/host.json'
      - '.github/workflows/deploy-function.yml'
  workflow_dispatch:

env:
  FUNCTION_APP_NAME: vxt-function
  RESOURCE_GROUP: VXT-IoT-Hub
  PYTHON_VERSION: '3.11'
  FUNCTION_DIR: azure-functions

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Verify credentials exist
      run: |
        echo "Checking AZURE_CREDENTIALS secret..."
        if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then
          echo "❌ ERROR: AZURE_CREDENTIALS secret is empty!"
          exit 1
        fi
        echo "✓ AZURE_CREDENTIALS secret is set"
    
    - name: Install dependencies
      working-directory: ${{ env.FUNCTION_DIR }}
      run: |
        echo "Step: Installing Python dependencies..."
        python -m pip install --upgrade pip
        echo "Installing requirements.txt packages..."
        pip install -r requirements.txt
        echo "✓ Dependencies installed successfully"
    
    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Verify Azure login
      run: |
        echo "Verifying Azure login..."
        az account show
        echo "✓ Azure login successful"
    
    - name: Verify Function Files
      working-directory: ${{ env.FUNCTION_DIR }}
      run: |
        echo "Step: Checking function files..."
        ls -la function_app.py host.json requirements.txt
        echo "✓ All required files present"
    
    - name: Deploy to Azure Function
      run: |
        cd ${{ env.FUNCTION_DIR }}
        echo "Creating deployment package..."
        zip -r /tmp/function.zip . -x ".git*" ".venv*" "__pycache__*" ".pytest*" "*.pyc"
        
        echo "Deploying to Azure Function..."
        az functionapp deployment source config-zip \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name ${{ env.FUNCTION_APP_NAME }} \
          --src /tmp/function.zip
        
        echo "✓ Deployment completed"
    
    - name: Configure Function App Settings
      run: |
        echo "Step: Configuring Azure Function environment variables..."
        echo "Setting database and IoT Hub connection configuration..."
        
        az functionapp config appsettings set \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --name ${{ env.FUNCTION_APP_NAME }} \
          --settings \
            DB_SERVER="vxtdb.database.windows.net" \
            DB_NAME="free-sql-db-5949639" \
            DB_USER="${{ secrets.DB_USER }}" \
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            IoTHubConnectionString="${{ secrets.IOT_HUB_CONNECTION_STRING }}" \
            PROVIDER_NAME="N2KToSignalK" \
            FUNCTIONS_WORKER_RUNTIME="python"
        
        echo "✓ Function app settings configured successfully"
        echo ""
        echo "Settings applied:"
        echo "  - DB_SERVER=vxtdb.database.windows.net"
        echo "  - DB_NAME=free-sql-db-5949639"
        echo "  - DB_USER=*** (from secrets)"
        echo "  - DB_PASSWORD=*** (from secrets)"
        echo "  - IoTHubConnectionString=*** (from secrets)"
        echo "  - PROVIDER_NAME=N2KToSignalK"

  test:
    needs: deploy
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Wait for deployment
      run: sleep 15
    
    - name: Test Function Health Endpoint
      run: |
        for i in {1..5}; do
          echo "Attempt $i: Testing function health..."
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            https://${{ env.FUNCTION_APP_NAME }}.azurewebsites.net/api/health)
          
          if [ "$response" = "200" ]; then
            echo "✓ Function is healthy (HTTP $response)"
            exit 0
          fi
          
          echo "Response: HTTP $response - Retrying in 10 seconds..."
          sleep 10
        done
        
        echo "❌ Function health check failed"
        exit 1
    
    - name: Log deployment success
      if: success()
      run: echo "✓ Azure Function deployed and tested successfully"
    
    - name: Log deployment failure
      if: failure()
      run: echo "❌ Deployment failed - check logs above"
