name: Deploy Dashboards to Static Web Apps

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # Build health-dashboard
      - name: Install health-dashboard dependencies
        working-directory: health-dashboard
        run: npm install

      - name: Build health-dashboard with production API
        working-directory: health-dashboard
        run: npm run build
        env:
          VITE_API_BASE: 'https://vxt-web-app.azurewebsites.net'

      # Build admin-dashboard
      - name: Install admin-dashboard dependencies
        working-directory: admin-dashboard
        run: npm install

      - name: Build admin-dashboard
        working-directory: admin-dashboard
        run: npm run build

      # Deploy admin-dashboard (main root)
      - name: Deploy admin-dashboard to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATICWEBAPP_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'admin-dashboard/dist'
          api_location: ''
          output_location: ''
