name: Deploy to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Build React Admin Dashboard
        run: |
          cd admin-dashboard
          npm install
          npm run build
          cd ..
      
      - name: Prepare Deployment Package (React + APIs only)
        run: |
          mkdir -p deployment-pkg
          cp main.py deployment-pkg/
          cp requirements.txt deployment-pkg/
          cp -r admin-dashboard/dist deployment-pkg/
          cp -r admin-dashboard/dist deployment-pkg/public 2>/dev/null || true
          echo "Web.config for Azure App Service" > deployment-pkg/Web.config || true
      
      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'vxt-admin-app'
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: deployment-pkg
      
      - name: Deployment Summary
        run: |
          echo "✅ Deployment Complete!"
          echo "Frontend (React): https://vxt-admin-app.azurewebsites.net"
          echo "API Endpoints: https://vxt-admin-app.azurewebsites.net/api/*"
