name: Deploy to Azure Web App

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  deploy-web-app:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Verify Python and dependencies
        run: |
          echo "Python version:"
          python --version
          echo ""
          echo "Installing pip dependencies..."
          pip install --upgrade pip
          pip install -r requirements.txt
          echo ""
          echo "Verifying imports..."
          python -c "import fastapi; import uvicorn; import pymssql; print('✓ All dependencies loaded successfully')"
      
      - name: Azure Web App Deploy
        uses: azure/webapps-deploy@v2
        with:
          app-name: vxt-web-app
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
          package: .
      
      - name: Configure startup (Post-Deploy)
        run: |
          echo "✅ Web App deployed successfully"
          echo "App Name: vxt-web-app"
          echo "API URL: https://vxt-web-app.azurewebsites.net"
          echo "Health Check: https://vxt-web-app.azurewebsites.net/health/db"
