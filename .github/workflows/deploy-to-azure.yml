name: Deploy to Azure Web App

on:
  push:
    branches:
      - prod
  workflow_dispatch:

jobs:
  deploy-to-web-app:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      
      - name: Deploy Docker image to Web App
        run: |
          az webapp config container set \
            --name vxt-web-app \
            --resource-group VXT-IoT-Hub \
            --docker-custom-image-name vxtacr.azurecr.io/vxt-web-app:latest \
            --docker-registry-server-url https://vxtacr.azurecr.io \
            --docker-registry-server-user ${{ secrets.ACR_USERNAME }} \
            --docker-registry-server-password ${{ secrets.ACR_PASSWORD }}
      
      - name: Restart Web App
        run: |
          az webapp restart --name vxt-web-app --resource-group VXT-IoT-Hub
      
      - name: Deployment Summary
        run: |
          echo "✅ Deployment Complete!"
          echo "Web App: https://vxt-web-app.azurewebsites.net"
          echo "API Endpoints: https://vxt-web-app.azurewebsites.net/api/*"
          echo "Health Check: https://vxt-web-app.azurewebsites.net/health/db"
