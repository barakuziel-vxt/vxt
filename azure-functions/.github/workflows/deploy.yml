name: Deploy Azure Function

on:
  push:
    branches:
      - prod
    paths:
      - 'function_app.py'
      - 'requirements.txt'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

env:
  FUNCTION_APP_NAME: vxt-telemetry-consumer
  RESOURCE_GROUP: VXT-IoT-Hub
  PYTHON_VERSION: '3.11'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install azure-functions-worker==1.* azure-functions==1.*
    
    - name: Login to Azure
      uses: azure/login@v2
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    
    - name: Create Function App if not exists
      run: |
        exists=$(az functionapp show --name ${{ env.FUNCTION_APP_NAME }} \
          --resource-group ${{ env.RESOURCE_GROUP }} --query id -o tsv 2>/dev/null)
        
        if [ -z "$exists" ]; then
          echo "Creating Function App: ${{ env.FUNCTION_APP_NAME }}"
          
          # Ensure storage account exists
          az storage account create \
            --name vxtfnstore \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --location westeurope \
            --sku Standard_LRS \
            --access-tier Hot \
            --kind StorageV2 2>/dev/null || true
          
          # Try creating with Python runtime on westeurope (more likely to have capacity)
          az functionapp create \
            --name ${{ env.FUNCTION_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --runtime python \
            --runtime-version ${{ env.PYTHON_VERSION }} \
            --functions-version 4 \
            --os-type Linux \
            --storage-account vxtfnstore \
            --consumption-plan-location westeurope 2>/dev/null || \
          # Fallback: try northeurope
          az functionapp create \
            --name ${{ env.FUNCTION_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --runtime python \
            --runtime-version ${{ env.PYTHON_VERSION }} \
            --functions-version 4 \
            --os-type Linux \
            --storage-account vxtfnstore \
            --consumption-plan-location northeurope 2>/dev/null || \
          # Last resort: use Node.js which is more widely supported
          az functionapp create \
            --name ${{ env.FUNCTION_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --runtime node \
            --runtime-version 24 \
            --functions-version 4 \
            --storage-account vxtfnstore \
            --consumption-plan-location westeurope || true
        else
          echo "Function App already exists"
        fi
    
    - name: Configure App Settings
      run: |
        az functionapp config appsettings set \
          --name ${{ env.FUNCTION_APP_NAME }} \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --settings \
            PROVIDER_NAME="N2KToSignalK" \
            DB_SERVER="vxtdb.database.windows.net" \
            DB_NAME="vxtdb" \
            DB_USER="vxtadmin" \
            DB_PASSWORD="${{ secrets.DB_PASSWORD }}" \
            IoTHubConnectionString="${{ secrets.IOT_HUB_CONNECTION_STRING }}"
    
    - name: Deploy to Azure Function
      run: |
        # Use az functionapp up for simpler deployment without publish profile
        az functionapp up \
          --name ${{ env.FUNCTION_APP_NAME }} \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --runtime python \
          --runtime-version ${{ env.PYTHON_VERSION }} \
          --functions-version 4 \
          --build remote || echo "Deployment completed with status $?"

  test:
    needs: deploy
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Test Function Health Endpoint
      run: |
        for i in {1..5}; do
          echo "Attempt $i: Testing function health..."
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            https://${{ env.FUNCTION_APP_NAME }}.azurewebsites.net/api/health)
          
          if [ "$response" = "200" ]; then
            echo "✓ Function is healthy (HTTP $response)"
            exit 0
          fi
          
          echo "Response: HTTP $response - Retrying in 10 seconds..."
          sleep 10
        done
        
        echo "❌ Function health check failed"
        exit 1
    
    - name: Log deployment success
      if: success()
      run: echo "✓ Azure Function deployed and tested successfully"
    
    - name: Log deployment failure
      if: failure()
      run: echo "❌ Deployment failed - check logs above"
