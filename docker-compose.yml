version: '3.8'

services:
  # 1. Database: SQL Server 2022 (compatible with mssql-python, mirrors Azure SQL)
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: yacht-sql
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrongPassword123!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'YourStrongPassword123!' -Q 'SELECT 1' -C -N || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 2. Message broker: Redpanda (Kafka-compatible, mirrors Azure IoT Hub)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: yacht-broker
    command:
      - redpanda
      - start
      - --smp
      - "1"
      - --overprovisioned
      - --kafka-addr
      - 0.0.0.0:9092
      - --advertise-kafka-addr
      - 127.0.0.1:9092
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "rpk broker list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # 3. Redpanda Console (Kafka UI — http://localhost:8080)
  console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: yacht-console
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "kafka:
          brokers: [\"redpanda:9092\"]" > /tmp/config.yml
        /app/console --config.filepath /tmp/config.yml
    ports:
      - "8080:8080"
    depends_on:
      - redpanda
volumes:
  sql_data:
